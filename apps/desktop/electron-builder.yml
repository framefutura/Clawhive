appId: ai.clawhive.desktop
productName: ClawHive
copyright: Copyright 2026 ClawHive
category: public.app-category.productivity

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!node_modules/**/*"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    x: 100
    y: 100
    width: 540
    height: 380

# Additional files to include (for sql.js WASM in later plans)
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
